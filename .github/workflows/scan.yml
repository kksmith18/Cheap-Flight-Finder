name: Daily flight scan

on:
  schedule:
    # 10:00 UTC = 6:00 AM Eastern (EDT). Drifts to 5:00 AM Eastern during EST
    # (winter) since a single cron expression can't shift for DST — see README.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python tracker.py

      - name: Persist tracker.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.db
          git diff --cached --quiet || git commit -m "Update tracker.db [skip ci]"
          git push
